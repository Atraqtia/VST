name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # CMakeLists.txt は ../JUCE を参照するので、リポジトリの隣に JUCE を置く
      - name: Get JUCE
        shell: bash
        run: git clone --depth 1 --branch 8.0.8 https://github.com/juce-framework/JUCE.git ../JUCE

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: MySausageFattener-VST3-win64
          path: build/MySausageFattener_artefacts/Release/VST3/
